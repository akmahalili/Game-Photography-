<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lensapoli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Lensapoli: permainan papan fotografi gaya Monopoly/Saidina untuk dewasa. Beli lokasi ikonik Malaysia, upgrade gear, Snap Challenge, Duel Shutter, Bida Panas dan Golden Hour.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: papan ialah contact sheet filem di atas light table; rel kanan ialah clipboard jurugambar. Telefon: papan dahulu, rel di bawah. */
:root{
  --bg:#e4e8ec; --hole:#e4e8ec;
  --paper:#ffffff; --paper-2:#f0f2f5; --ink:#16191d; --muted:#59626e; --line:#cdd3da;
  --film:#2a211b; --film-ink:#f0a33a;
  --accent:#cf5410; --accent-ink:#ffffff;
  --gold:#f2b43a; --gold-ink:#2a1700;
  --good:#1b8546; --bad:#c3342a;
  --klien:#1f5fbf; --viral:#c2337a; --snap:#cf5410;
  --g0:#8a5a3b; --g1:#56b3e6; --g2:#cf3f93; --g3:#f08a24; --g4:#d63a3a; --g5:#e5c01b; --g6:#2b9a58; --g7:#2c4aa3;
  --shadow:0 1px 2px rgb(22 25 29 / .08), 0 10px 30px rgb(22 25 29 / .12);
  --f-display:'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131013; --hole:#131013;
    --paper:#1f1b1f; --paper-2:#2a252b; --ink:#f2ede6; --muted:#a89f98; --line:#3d363c;
    --film:#0a0807; --film-ink:#f0a33a;
    --accent:#f28a3c; --accent-ink:#1d0e02;
    --gold:#f5c04f; --gold-ink:#2a1700;
    --good:#45c27a; --bad:#f0625a;
    --klien:#6a9af2; --viral:#ef6aab; --snap:#f28a3c;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 34px rgb(0 0 0 / .45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131013; --hole:#131013;
  --paper:#1f1b1f; --paper-2:#2a252b; --ink:#f2ede6; --muted:#a89f98; --line:#3d363c;
  --film:#0a0807; --film-ink:#f0a33a;
  --accent:#f28a3c; --accent-ink:#1d0e02;
  --gold:#f5c04f; --gold-ink:#2a1700;
  --good:#45c27a; --bad:#f0625a;
  --klien:#6a9af2; --viral:#ef6aab; --snap:#f28a3c;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 34px rgb(0 0 0 / .45);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100%}
body.modal-open{overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lbl{font:600 10.5px/1.25 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.neg{color:var(--bad)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}

/* Buttons */
.btn{appearance:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;line-height:1.15;text-align:center;transition:transform .08s,border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){border-color:var(--ink)}
.btn.hot{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.btn.sm{min-height:34px;padding:6px 10px;border-radius:8px;font:600 12.5px/1.1 var(--f-mono)}

/* App frame */
.app{display:grid;grid-template-columns:minmax(0,760px) minmax(300px,370px);gap:22px;justify-content:center;align-items:start;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{min-width:0}
@media (min-width:921px){.board-wrap{max-width:calc(100dvh - 48px);margin-inline:auto}}
@media (max-width:920px){.app{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:12px 24px}}

/* Board: a strip of film */
.board-wrap{container-type:inline-size;container-name:board;width:100%}
.board{position:relative;background:var(--film);padding:3.4cqi;border-radius:1.4cqi;box-shadow:var(--shadow);transition:box-shadow .6s}
.board::before,.board::after{content:"";position:absolute;left:3.4cqi;right:3.4cqi;height:1.4cqi;background:repeating-linear-gradient(90deg,var(--hole) 0 1.7cqi,transparent 1.7cqi 3.6cqi);opacity:.92}
.board::before{top:1cqi}
.board::after{bottom:1cqi}
.edge{position:absolute;top:50%;font:600 clamp(6px,1.05cqi,10px)/1 var(--f-mono);letter-spacing:.28em;color:var(--film-ink);white-space:nowrap;writing-mode:vertical-rl}
.edge-l{left:1.15cqi;transform:translateY(-50%) rotate(180deg)}
.edge-r{right:1.15cqi;transform:translateY(-50%)}
.grid{display:grid;aspect-ratio:1;width:100%;grid-template-columns:minmax(0,1.55fr) repeat(9,minmax(0,1fr)) minmax(0,1.55fr);grid-template-rows:minmax(0,1.55fr) repeat(9,minmax(0,1fr)) minmax(0,1.55fr);gap:.36cqi}

.cell{--band:transparent;--oc:transparent;position:relative;appearance:none;border:0;margin:0;padding:.35cqi;background:var(--paper);color:var(--ink);border-radius:.35cqi;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25cqi;text-align:center;cursor:pointer;min-width:0;min-height:0;font-family:var(--f-body);transition:background .4s}
.cell:hover{filter:brightness(.97)}
.cell .band{position:absolute;background:var(--band)}
.cell.b{padding-top:2cqi}.cell.b .band{top:0;left:0;right:0;height:1.6cqi}
.cell.t{padding-bottom:2cqi}.cell.t .band{bottom:0;left:0;right:0;height:1.6cqi}
.cell.l{padding-right:2cqi}.cell.l .band{right:0;top:0;bottom:0;width:1.6cqi}
.cell.r{padding-left:2cqi}.cell.r .band{left:0;top:0;bottom:0;width:1.6cqi}
.cell .nm{font:650 clamp(6.5px,1.18cqi,12px)/1.06 var(--f-body);overflow-wrap:break-word;max-width:100%}
.cell .pr{font:500 clamp(6px,1.02cqi,11px)/1 var(--f-mono);color:var(--muted)}
.cell.owned{box-shadow:inset 0 0 0 .42cqi var(--oc)}
.cell.mort{background:repeating-linear-gradient(135deg,var(--paper) 0 .8cqi,var(--paper-2) .8cqi 1.6cqi)}
.cell.mort .nm,.cell.mort .pr{opacity:.55}
.cell.here{outline:.45cqi solid var(--cur,var(--accent));outline-offset:-.45cqi;z-index:1}
.lvl{position:absolute;display:flex;gap:.3cqi;z-index:1}
.cell.b .lvl{top:.33cqi;left:50%;transform:translateX(-50%)}
.cell.t .lvl{bottom:.33cqi;left:50%;transform:translateX(-50%)}
.cell.l .lvl{right:.33cqi;top:50%;transform:translateY(-50%);flex-direction:column}
.cell.r .lvl{left:.33cqi;top:50%;transform:translateY(-50%);flex-direction:column}
.lvl i{width:.95cqi;height:.95cqi;border-radius:50%;background:var(--paper);box-shadow:0 0 0 .12cqi var(--ink)}
.lvl i.studio{width:1.6cqi;height:.95cqi;border-radius:.2cqi;background:var(--ink);box-shadow:0 0 0 .12cqi var(--paper)}

.toks{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;padding:.6cqi;pointer-events:none;z-index:2}
.tk{width:clamp(12px,2.6cqi,23px);aspect-ratio:1;border-radius:50%;background:var(--pc,#888);color:#fff;display:inline-grid;place-items:center;font:800 clamp(6.5px,1.3cqi,11px)/1 var(--f-body);border:max(1.5px,.25cqi) solid var(--paper);box-shadow:0 1px 3px rgb(0 0 0 / .4);margin:-.25cqi}
.tk.cur{animation:tokPulse 1.3s ease-in-out infinite}
.tk.hop{animation:hop .2s ease-out}
@keyframes tokPulse{50%{transform:scale(1.18)}}
@keyframes hop{0%{transform:translateY(-55%) scale(1.15)}100%{transform:none}}

/* Special squares */
.k-snap{background:color-mix(in srgb,var(--snap) 13%,var(--paper))}
.ap{width:clamp(12px,3.1cqi,30px);aspect-ratio:1;border-radius:50%;flex:none;background:radial-gradient(circle,var(--paper) 0 24%,transparent 26%),repeating-conic-gradient(from 12deg,var(--snap) 0 38deg,color-mix(in srgb,var(--snap) 55%,var(--ink)) 38deg 60deg)}
.glyph{font:900 clamp(12px,3cqi,28px)/1 var(--f-display);font-stretch:80%}
.k-klien .glyph{color:var(--klien)}
.k-viral .glyph{color:var(--viral)}
.k-tax{background:var(--paper-2)}
.ico{flex:none}
.ico.plat{width:clamp(11px,2.7cqi,24px);height:clamp(8px,1.9cqi,17px);border:max(1.5px,.3cqi) solid var(--ink);border-radius:.3cqi;background:linear-gradient(135deg,transparent 52%,var(--ink) 53% 70%,transparent 71%),radial-gradient(circle at 30% 34%,var(--ink) 0 14%,transparent 16%)}
.ico.util{width:clamp(11px,2.5cqi,22px);aspect-ratio:1;border-radius:50%;border:max(2px,.45cqi) solid var(--ink);box-shadow:inset 0 0 0 max(1.5px,.3cqi) var(--paper),inset 0 0 0 max(3px,.75cqi) var(--muted)}
.corner{padding:.8cqi;gap:.45cqi}
.corner .big{font:900 clamp(8.5px,2.05cqi,20px)/.92 var(--f-display);font-stretch:68%;text-transform:uppercase;letter-spacing:.01em}
.corner .small{font:500 clamp(6px,1.02cqi,11px)/1.15 var(--f-mono);color:var(--muted)}
.k-go{background:var(--accent);color:var(--accent-ink)}
.k-go .small{color:inherit;opacity:.85}
.k-go .arrow{font:900 clamp(13px,3.4cqi,32px)/1 var(--f-display)}
.k-jail{background:repeating-linear-gradient(90deg,var(--paper) 0 1.3cqi,var(--paper-2) 1.3cqi 2.6cqi)}
.k-golden{background:radial-gradient(circle at 50% 40%,var(--gold) 0 34%,color-mix(in srgb,var(--gold) 68%,var(--accent)) 80%);color:var(--gold-ink)}
.k-golden .small{color:var(--gold-ink);font-weight:600}
.sun{width:clamp(14px,3.4cqi,32px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--gold-ink) 0 36%,transparent 38%),repeating-conic-gradient(var(--gold-ink) 0 10deg,transparent 10deg 30deg);-webkit-mask:radial-gradient(circle,#000 0 70%,transparent 71%);mask:radial-gradient(circle,#000 0 70%,transparent 71%)}
.k-gotojail{background:var(--ink);color:var(--paper)}
.k-gotojail .small{color:var(--paper);opacity:.7}
.k-gotojail .small.err{color:var(--bad);opacity:1;margin:0}

/* Board centre */
.center{grid-row:2/11;grid-column:2/11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25cqi;background:var(--paper-2);border-radius:.6cqi;padding:2cqi;text-align:center;min-width:0;min-height:0;overflow:hidden;transition:background .6s}
.eyebrow{font:600 clamp(7px,1.25cqi,12px)/1 var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.logo{margin:0;font:900 clamp(30px,10.4cqi,88px)/.82 var(--f-display);font-stretch:62%;letter-spacing:-.005em;text-transform:uppercase}
.logo span{color:var(--accent)}
.tagline{margin:0;font-size:clamp(10px,1.55cqi,14px);color:var(--muted);max-width:44ch;text-wrap:balance}
.status{display:flex;align-items:center;gap:1cqi;font:750 clamp(12px,2.3cqi,21px)/1.1 var(--f-body)}
.status .tk{margin:0;width:clamp(16px,3cqi,26px);font-size:clamp(8px,1.4cqi,12px)}
.status-sub{margin:-.6cqi 0 0;font-size:clamp(10px,1.5cqi,14px);color:var(--muted)}
.dice{display:flex;gap:1.6cqi}
.die{width:clamp(32px,7.2cqi,62px);aspect-ratio:1;background:var(--paper);border:1.5px solid var(--line);border-radius:22%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:15%;gap:7%;box-shadow:0 3px 0 var(--line)}
.die i{border-radius:50%}
.die i.on{background:var(--ink)}
.die.rolling{animation:shake .14s linear infinite}
@keyframes shake{25%{transform:rotate(-14deg) translateY(-3px)}75%{transform:rotate(12deg) translateY(2px)}}
.main-btn{border-radius:999px;padding:1.3cqi 3.6cqi;min-height:40px;font:800 clamp(13px,2.25cqi,19px)/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase}
.main-btn.pulse{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.mchips{display:flex;flex-wrap:wrap;gap:.8cqi;justify-content:center}
.mchip{font:600 clamp(9px,1.32cqi,12px)/1 var(--f-mono);padding:.65cqi 1.15cqi;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.mchip.late{border-color:var(--bad);color:var(--bad)}
.mchip.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
@container board (max-width:540px){
  .cell .pr,.edge,.tagline,.corner .small{display:none}
  .cell .nm{font-family:var(--f-display);font-stretch:66%;font-weight:750;font-size:max(7.5px,2cqi);line-height:1}
  .corner .big{font-size:max(8px,2.5cqi)}
  .center{gap:1.6cqi}
}

/* Golden Hour */
.board.golden{box-shadow:0 0 0 .55cqi var(--gold),0 0 6cqi color-mix(in srgb,var(--gold) 65%,transparent);animation:glow 2.6s ease-in-out infinite}
.board.golden .cell:not(.corner){background:color-mix(in srgb,var(--gold) 17%,var(--paper))}
.board.golden .center{background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--gold) 38%,var(--paper-2)),var(--paper-2) 72%)}
@keyframes glow{50%{box-shadow:0 0 0 .55cqi var(--gold),0 0 9cqi color-mix(in srgb,var(--gold) 85%,transparent)}}

/* Rail */
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:921px){.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100dvh - 40px);overflow:auto;padding-bottom:4px}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.now{border-top:6px solid var(--pc,var(--accent))}
.now-intro{margin:6px 0 0;max-width:60ch}
.now-name{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font:900 30px/1 var(--f-display);font-stretch:70%;text-transform:uppercase;min-width:0}
.now-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats b{display:block;font:700 18px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.fbar{height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden;margin-top:12px}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,var(--viral),var(--accent));border-radius:inherit;transition:width .6s}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts .btn{flex:1 1 120px}
.disc{width:28px;aspect-ratio:1;border-radius:50%;background:var(--pc,#888);color:#fff;display:inline-grid;place-items:center;font:800 13px/1 var(--f-body);flex:none}
.plist h3,.feed h3{margin:0 0 6px}
.plist ol,.feed ol{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist li.cur .pl-name{font-weight:750}
.plist li.out{opacity:.5}
.pl-name{min-width:0;overflow-wrap:anywhere}
.pl-num{text-align:right;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.pl-num b{font:700 15px/1.2 var(--f-mono)}
.pl-num .fol{font-size:12px;color:var(--muted)}
.sws{grid-column:2/4;display:flex;flex-wrap:wrap;gap:3px}
.sw{display:inline-block;width:10px;height:14px;border-radius:2px;background:var(--band,var(--muted));flex:none}
.sw.m{opacity:.3}
.sw.tall{width:8px;height:auto;align-self:stretch;border-radius:3px}
.chip{display:inline-block;font:600 10.5px/1 var(--f-mono);padding:3px 6px;border-radius:99px;background:var(--paper-2);border:1px solid var(--line);vertical-align:2px;white-space:nowrap}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.cash.up{animation:bumpUp .9s ease-out}
.cash.down{animation:bumpDown .9s ease-out}
@keyframes bumpUp{0%{color:var(--good);transform:scale(1.2)}100%{transform:none}}
@keyframes bumpDown{0%{color:var(--bad);transform:scale(1.2)}100%{transform:none}}
.feed ol{max-height:280px;overflow:auto}
.feed li{font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.feed li:last-child{border-bottom:0}
.pn{font-weight:700;white-space:nowrap}
.pn::before{content:"";display:inline-block;width:.62em;height:.62em;border-radius:50%;background:var(--pc);margin-right:.3em;vertical-align:.05em}
.rail-foot{display:flex;flex-wrap:wrap;gap:8px}
.rail-foot .btn{flex:1 1 auto}

/* Modal */
#modal{position:fixed;inset:0;z-index:60;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;overflow-y:auto;background:rgb(12 9 7 / .6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{--tone:var(--accent);position:relative;min-width:0;width:min(100%,480px);background:var(--paper);color:var(--ink);border-radius:16px;padding:20px 22px 18px;box-shadow:0 24px 70px rgb(0 0 0 / .4);border-top:8px solid var(--tone);animation:sheetIn .26s cubic-bezier(.2,.9,.3,1.15)}
.sheet.wide{width:min(100%,660px)}
.sheet.card{animation:flipIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translateY(18px) scale(.97);opacity:0}}
@keyframes flipIn{from{transform:perspective(900px) rotateY(75deg) scale(.9);opacity:0}}
.kicker{margin:0 0 6px;font:600 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tone)}
.sheet h2{margin:0 0 12px;font:900 clamp(28px,6.4vw,40px)/.95 var(--f-display);font-stretch:66%;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.mbody p{margin:0 0 10px;max-width:62ch}
.mbody>:last-child{margin-bottom:0}
.mbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.mbtns .btn{flex:1 1 140px}
.tone-klien{--tone:var(--klien)}
.tone-viral{--tone:var(--viral)}
.tone-snap{--tone:var(--snap)}
.tone-hot{--tone:var(--ink)}
.tone-gold{--tone:var(--gold)}
.tone-bad{--tone:var(--bad)}
.tone-good{--tone:var(--good)}
.tone-jail{--tone:var(--muted)}
.tone-kilat{--tone:var(--gold)}
.big-num{font:900 clamp(40px,10vw,60px)/1 var(--f-display);font-stretch:70%;margin:2px 0 8px!important;font-variant-numeric:tabular-nums}
.card-face{border:1.5px dashed var(--tone);border-radius:12px;padding:14px 16px;font-size:16.5px;background:color-mix(in srgb,var(--tone) 7%,var(--paper))}
.duel-offer{border-left:4px solid var(--ink);background:var(--paper-2);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:6px}

.timer{position:relative;width:min(160px,48vw);margin:10px auto 2px}
.timer svg{display:block;width:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--paper-2);stroke-width:10}
.ring-fg{fill:none;stroke:var(--tone);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font:900 56px/1 var(--f-display);font-stretch:70%;font-variant-numeric:tabular-nums}

.timer.hurry .tnum{color:var(--bad);animation:throb 1s ease-in-out infinite}

.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:12px}
.pick{appearance:none;border:2px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-height:56px;text-align:left;min-width:0}
.pick span:last-child{overflow-wrap:anywhere}
.pick:hover{border-color:var(--pc,var(--ink))}
.stars{display:flex;gap:6px;justify-content:center;margin-top:12px}
.star{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:4px 6px;color:var(--line);min-width:44px}
.star span{font-size:42px;line-height:1}
.star small{font:600 11px/1 var(--f-mono);color:var(--muted)}
.star.lit{color:var(--gold)}

.deed{--band:var(--muted)}
.deed-band{height:12px;border-radius:6px;background:var(--band);margin-bottom:10px}
.deed-own{font-size:14px}
.deed-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.deed-t td{padding:6px 0;border-bottom:1px solid var(--line)}
.deed-t td:last-child{text-align:right;font-family:var(--f-mono)}
.deed-t tr.on td{font-weight:700;color:var(--accent)}
.deed-t tr.sep td{color:var(--muted)}
.tip{background:var(--paper-2);border-radius:10px;padding:10px 12px;margin-top:12px!important;font-size:14px}
.tip .lbl{display:block;margin-bottom:3px}

.auc-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.auc-top .big-num{display:block;margin:0!important}
.auc-clock{text-align:center;border:2px solid var(--tone);border-radius:14px;padding:6px 14px;min-width:84px}
.auc-clock b{display:block;font:900 40px/1 var(--f-display);font-stretch:70%;font-variant-numeric:tabular-nums}
.auc-clock.hurry{border-color:var(--bad);color:var(--bad);animation:throb .5s ease-in-out infinite}
.auc-call{font:800 18px/1.2 var(--f-body);color:var(--tone);min-height:1.2em;margin:10px 0!important}
.auc-rows{display:flex;flex-direction:column;gap:6px}
.auc-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:8px 10px;border-radius:10px;background:var(--paper-2);border:2px solid transparent}
.auc-row.lead{border-color:var(--pc)}
.auc-row .who{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.auc-btns{display:flex;gap:6px}

.mg-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mg-head b{display:block;font:700 18px/1.2 var(--f-mono)}
.mg-head .btn{margin-left:auto}
.mg-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mg-info{flex:1 1 170px;min-width:0;display:flex;flex-direction:column}
.mg-info .muted{font-size:13px}
.mg-actions{display:flex;flex-wrap:wrap;gap:6px}

.deal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:600px){.deal{grid-template-columns:minmax(0,1fr)}}
.deal-col h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:15px}
.deal-props{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow:auto;margin-bottom:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 8px;border-radius:8px;background:var(--paper-2);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.fld input,.fld select,.setup-row input{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper-2);color:var(--ink);padding:0 12px;font:600 16px var(--f-body);width:100%;min-width:0}
.deal-sum p{padding:10px 12px;background:var(--paper-2);border-radius:10px}

.setup-rows{display:flex;flex-direction:column;gap:8px;margin:12px 0 10px}
.setup-row{display:flex;gap:8px;align-items:center}
.setup-row .disc{width:32px;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:480px){.opts{grid-template-columns:minmax(0,1fr)}}
.howto{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.howto summary{cursor:pointer;font-weight:700}
.howto ul{margin:8px 0 0;padding-left:18px}
.howto li{margin:4px 0}

.rules h3{margin:16px 0 4px;font:900 20px/1 var(--f-display);font-stretch:70%;text-transform:uppercase}
.rules h3:first-child{margin-top:0}
.rules p{font-size:14.5px}
.tbl-wrap{overflow-x:auto;margin-top:8px}
.res{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.res th{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1.5px solid var(--line)}
.res td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.res th:nth-child(-n+2),.res td:nth-child(-n+2){text-align:left}
.res tr.out td{opacity:.55}
@media (max-width:480px){.res th:nth-child(3),.res td:nth-child(3),.res th:nth-child(4),.res td:nth-child(4){display:none}}
.winner{display:flex;align-items:center;gap:10px;font-size:20px}

/* Effects */
#toasts{position:fixed;left:0;right:0;bottom:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:min(460px,100%);text-align:center;animation:toastIn .25s ease-out;transition:opacity .35s,transform .35s}
.toast.good{background:var(--good);color:var(--paper)}
.toast.bad{background:var(--bad);color:var(--paper)}
.toast.gold{background:var(--gold);color:var(--gold-ink)}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:95}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:96}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

const sfx=(()=>{
  let ctx=null,on=true;
  try{on=localStorage.getItem('lensapoli-sound')!=='off'}catch(e){}
  const ac=()=>{if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx};
  const tone=(f,t=.12,type='sine',vol=.14,when=0,slide)=>{const c=on&&ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+when;o.type=type;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.exponentialRampToValueAtTime(slide,s+t);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+t);o.connect(g).connect(c.destination);o.start(s);o.stop(s+t+.03)};
  const noise=(t=.05,when=0,vol=.3,freq=2000)=>{const c=on&&ac();if(!c)return;const len=Math.max(1,Math.floor(c.sampleRate*t)),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;f.type='bandpass';f.frequency.value=freq;g.gain.value=vol;s.connect(f).connect(g).connect(c.destination);s.start(c.currentTime+when)};
  return{
    unlock(){if(on)ac()},
    get on(){return on},
    toggle(){on=!on;try{localStorage.setItem('lensapoli-sound',on?'on':'off')}catch(e){}return on},
    shutter(){noise(.035,0,.55,3200);noise(.06,.09,.5,1700)},
    dice(){for(let i=0;i<8;i++)noise(.025,i*.055,.28,1100+Math.random()*1600)},
    step(){tone(640,.05,'triangle',.05)},
    cash(){tone(988,.08,'square',.05);tone(1319,.2,'square',.05,.08)},
    lose(){tone(392,.16,'sawtooth',.06);tone(262,.28,'sawtooth',.06,.14)},
    tick(){tone(1250,.04,'square',.045)},
    beep(){tone(880,.16,'sine',.13)},
    card(){noise(.14,0,.22,5200)},
    siren(){tone(480,.45,'sawtooth',.05,0,920);tone(920,.45,'sawtooth',.05,.45,480)},
    fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.24,'triangle',.11,i*.11))},
    hammer(){noise(.09,0,.6,380);tone(170,.18,'sine',.22)}
  };
})();

}
function rentOf(i,roll){const o=S.own[i];if(!o||o.o==null||o.m)return 0;return rentBase(i,roll)*(S.golden>0?2:1)}
function worth(pi){
  const p=P(pi);let assets=0;
  S.own.forEach((o,i)=>{if(o&&o.o===pi){assets+=o.m?SQ[i].p/2:SQ[i].p;if(o.lv)assets+=o.lv*GROUPS[SQ[i].g].hc}});

/* ---------- modal system ---------- */
let modalChain=Promise.resolve();
const modalOpen=()=>!$('#modal').hidden;
function modal(o){
  const run=()=>new Promise(resolve=>{
    const root=$('#modal');
    const buttons=o.buttons||[{label:'Teruskan',value:true,kind:'primary'}];
    root.innerHTML=`<div class="sheet${o.tone?' tone-'+o.tone:''}${o.wide?' wide':''}${o.card?' card':''}" role="dialog" aria-modal="true"${o.title?' aria-labelledby="mTitle"':''}${o.toneColor?` style="--tone:${o.toneColor}"`:''}>${o.kicker?`<p class="kicker">${o.kicker}</p>`:''}${o.title?`<h2 id="mTitle">${o.title}</h2>`:''}<div class="mbody">${o.body||''}</div>${buttons.length?`<div class="mbtns">${buttons.map((b,k)=>`<button type="button" class="btn ${b.kind||'ghost'}" data-bi="${k}"${b.disabled?' disabled':''}>${b.label}</button>`).join('')}</div>`:''}</div>`;
    root.hidden=false;document.body.classList.add('modal-open');
    let cleanup=null,closed=false;
    const close=v=>{if(closed)return;closed=true;try{cleanup&&cleanup()}catch(e){}root.hidden=true;root.innerHTML='';document.body.classList.remove('modal-open');resolve(v)};
    $$('[data-bi]',root).forEach(btn=>btn.addEventListener('click',()=>{const b=buttons[+btn.dataset.bi];sfx.unlock();if(b.onClick)b.onClick(close);else close(b.value)}));
    cleanup=o.onMount?o.onMount(root.firstElementChild,close)||null:null;
    const f=root.querySelector('.mbtns .btn.primary:not(:disabled)')||root.querySelector('.pick,.star,.mbtns .btn:not(:disabled)');
    if(f)f.focus({preventScroll:true});
  });
  const p=modalChain.then(run);
  modalChain=p.catch(()=>{});
  return p;
}
function timerModal(o){
  const api={},C=326.73;
  return modal({...o,body:`${o.note?`<p>${o.note}</p>`:''}<div class="timer"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="52"></circle><circle class="ring-fg" cx="60" cy="60" r="52"></circle></svg><span class="tnum">${o.seconds}</span></div>`,
    buttons:[{label:`Mula ${o.seconds} saat`,kind:'primary',onClick:()=>api.start()},{label:'Semua dah siap',kind:'ghost',onClick:()=>api.done()}],
    onMount(el,close){
      const num=$('.tnum',el),ring=$('.ring-fg',el),tm=$('.timer',el),bS=$('.mbtns .btn',el);
      let left=o.seconds,iv=null,cd=null;
      ring.style.strokeDasharray=C;
      const upd=()=>{num.textContent=left;num.classList.remove('word');ring.style.strokeDashoffset=C*(1-left/o.seconds);tm.classList.toggle('hurry',!!iv&&left<=10)};
      api.start=()=>{
        if(iv||cd)return;bS.disabled=true;let n=3;num.textContent=n;sfx.tick();
        cd=setInterval(()=>{n--;if(n>0){num.textContent=n;sfx.tick();return}
          clearInterval(cd);cd=null;num.textContent='SNAP!';num.classList.add('word');sfx.beep();
          iv=setInterval(()=>{left--;upd();if(left>0&&left<=5)sfx.tick();if(left<=0)api.done()},1000);
        },650);
      };
      api.done=()=>{clearInterval(iv);clearInterval(cd);close('done')};
      upd();
      return()=>{clearInterval(iv);clearInterval(cd)};
    }});
}

function rateStars(o){
  return modal({...o,body:(o.body||'')+`<div class="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-n="${n}" aria-label="${n} bintang"><span>★</span><small>${n}</small></button>`).join('')}</div>`,buttons:[],
    onMount(el,close){const st=$$('.star',el);st.forEach(b=>{const lit=()=>st.forEach(s=>s.classList.toggle('lit',+s.dataset.n<=+b.dataset.n));b.onmouseenter=lit;b.onfocus=lit;b.onclick=()=>close(+b.dataset.n)})}});
}

/* ---------- effects ---------- */
function toast(msg,tone=''){
  const t=document.createElement('div');t.className='toast '+tone;t.innerHTML=msg;$('#toasts').append(t);
  setTimeout(()=>t.classList.add('out'),2700);setTimeout(()=>t.remove(),3100);
}
function camFlash(){sfx.shutter();if(REDUCED)return;const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function confetti(big){
  if(REDUCED)return;
  const c=$('#confetti'),x=c.getContext('2d'),d=Math.min(2,window.devicePixelRatio||1);
  c.hidden=false;c.width=innerWidth*d;c.height=innerHeight*d;
  const cols=['#cf5410','#f2b43a','#56b3e6','#cf3f93','#2b9a58','#ffffff','#2c4aa3'];
  const parts=Array.from({length:big?240:110},()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.4,vx:(Math.random()-.5)*4*d,vy:(2+Math.random()*4)*d,r:(5+Math.random()*6)*d,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;cancelAnimationFrame(confetti.raf);
  const step=()=>{x.clearRect(0,0,c.width,c.height);
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.05*d;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}
    if(++f<210)confetti.raf=requestAnimationFrame(step);else{x.clearRect(0,0,c.width,c.height);c.hidden=true}};
  step();
}

/* ---------- movement ---------- */
async function rollDice(){
  sfx.dice();
  const d1=$('#d1'),d2=$('#d2');
  d1.classList.add('rolling');d2.classList.add('rolling');
  for(let k=0;k<(REDUCED?1:9);k++){d1.innerHTML=dieHTML(rand(1,6));d2.innerHTML=dieHTML(rand(1,6));await wait(65)}
  const r=[rand(1,6),rand(1,6)];S.dice=r;
  d1.classList.remove('rolling');d2.classList.remove('rolling');
  log(`${nm(S.turn)} lontar ${r[0]} + ${r[1]} = ${r[0]+r[1]}${r[0]===r[1]?' (kembar!)':''}`);
  renderCenter();renderRail();
  await wait(260);
  return r;
}
async function moveBy(pi,steps){
  const p=P(pi),dir=steps>0?1:-1;
  for(let k=0;k<Math.abs(steps);k++){
    p.pos=(p.pos+dir+40)%40;
    if(dir>0&&p.pos===0){gain(pi,200);sfx.cash();toast(`${esc(p.name)} lalu MULA: +RM200`,'good');log(`${nm(pi)} lalu MULA, terima RM200.`);renderRail()}
    renderTokens(pi);renderCells();sfx.step();
    await wait(REDUCED?60:170);
  }
  render();
  await wait(200);
}
async function moveTo(pi,target){await moveBy(pi,(target-P(pi).pos+40)%40)}
function sendToJail(pi){const p=P(pi);p.pos=10;p.jail=true;p.jt=0;if(pi===S.turn)S.dbl=0;log(`${nm(pi)} masuk Bengkel Kamera.`);render()}
function release(pi){const p=P(pi);p.jail=false;p.jt=0}
function startGolden(){S.golden=active().length+1;log('<b>Golden Hour bermula!</b> Semua sewa ×2 selama satu pusingan.');render()}

/* ---------- turn flow ---------- */
async function onMain(){
  sfx.unlock();
  if(!S){if(!modalOpen())setup();return}
  if(modalOpen())return;
  if(S.phase==='roll')return doTurn();
  if(S.phase==='end')return nextTurn();
  if(S.phase==='over')return showResults();
}
async function doTurn(){
  const pi=S.turn,p=cur();
  S.phase='busy';render();
  try{
    if(p.jail){await jailTurn(pi);return finish(false)}
    const d=await rollDice(),dbl=d[0]===d[1];
    if(dbl){
      S.dbl++;
      if(S.dbl>=3){
        sfx.lose();log(`${nm(pi)} dapat kembar 3 kali. Shutter overheat!`);
        await modal({tone:'bad',kicker:'Burst mode terlebih',title:'Shutter overheat!',body:'<p>Dadu kembar tiga kali berturut-turut. Kamera terlalu panas, terus ke Bengkel Kamera. Tidak lalu MULA.</p>'});
        sendToJail(pi);return finish(false);
      }
    }
    await moveBy(pi,d[0]+d[1]);
    await land(pi,d[0]+d[1]);
    finish(dbl&&!p.jail);
  }catch(err){console.error(err);if(S.phase==='busy'){S.phase='end';render()}}
}
function finish(again){
  if(S.phase==='over')return;
  if(checkWin())return;
  const p=cur();
  S.afterDebt=again?'roll':'end';
  S.phase=p.cash<0?'debt':S.afterDebt;
  if(S.phase==='debt')toast(`${esc(p.name)} berhutang ${RM(-p.cash)}. Jual gear, gadai lokasi atau isytihar muflis.`,'bad');
  else if(again)toast('Kembar! Burst mode, lontar sekali lagi.','good');
  save();render();
}
function nextTurn(){
  if(S.phase==='over')return;
  if(S.golden>0){S.golden--;if(!S.golden)log('Golden Hour tamat. Sewa kembali normal.')}
  S.dbl=0;
  if(S.finalCall){endGame('time');return}
  let t=S.turn;
  do{t=(t+1)%S.players.length}while(P(t).out);
  S.turn=t;S.afterDebt='roll';
  S.phase=cur().cash<0?'debt':'roll';
  save();render();
  S.kilatIn--;
  if(S.kilatIn<=0){S.kilatIn=rand(5,8);galeriKilat()}
}
function checkWin(){
  if(S.phase==='over')return true;
  const a=active();
  if(a.length<=1){endGame('last',a[0]);return true}
  if(S.goal){const w=a.find(i=>P(i).fol>=S.goal);if(w!=null){endGame('fame',w);return true}}
  return false;
}
async function land(pi,roll){
  const p=P(pi),q=SQ[p.pos];
  switch(q.k){
    case 'prop':case 'plat':case 'util':return landBuyable(pi,p.pos,roll);
    case 'snap':return snapChallenge(pi);
    case 'klien':case 'viral':return drawCard(q.k,pi,roll);
    case 'tax':
      payBank(pi,q.amt,true);sfx.lose();log(`${nm(pi)} bayar ${esc(q.n)} ${RM(q.amt)} ke Tabung Golden Hour.`);render();
      return modal({tone:'bad',kicker:'Bayaran wajib',title:esc(q.n),body:`<p>${esc(q.tip)}</p><p class="big-num">−${RM(q.amt)}</p><p class="muted">Tabung Golden Hour kini ${RM(S.pot)}. Siapa mendarat di Golden Hour kaut semuanya.</p>`});
    case 'golden':return goldenCorner(pi);
    case 'gotojail':
      sfx.lose();
      await modal({tone:'bad',kicker:'Petak 30',title:'Memory card corrupt!',body:'<p>Semua gambar shoot hari ini hilang. Hantar kamera ke Bengkel Kamera sekarang. Tidak lalu MULA, tiada bayaran.</p>'});
      sendToJail(pi);return;
    case 'jail':toast('Singgah di Bengkel Kamera. Tengok-tengok je.');return;
  }
}
async function goldenCorner(pi){
  const amt=S.pot;S.pot=0;if(amt)gain(pi,amt);
  sfx.siren();startGolden();confetti(true);
  log(`${nm(pi)} kaut Tabung Golden Hour ${RM(amt)}!`);render();
  await modal({tone:'gold',kicker:'Petak 20 · Jackpot',title:'Golden Hour!',body:`<p>Cahaya paling cantik hari ini milik anda. Anda kaut seluruh Tabung Golden Hour:</p><p class="big-num">+${RM(amt)}</p><p>Mulai sekarang <b>semua sewa ×2</b> selama satu pusingan penuh.</p>`});
}

  const q=SQ[i],o=S?S.own[i]:null;
  let rows='';
  if(q.k==='prop'){
    rows=`<tr class="${o&&o.o!=null&&!o.lv&&!hasSet(o.o,q.g)?'on':''}"><td>Sewa asas</td><td>${RM(q.r[0])}</td></tr><tr class="${o&&o.o!=null&&!o.lv&&hasSet(o.o,q.g)?'on':''}"><td>Set penuh satu warna (×2)</td><td>${RM(q.r[0]*2)}</td></tr>`+
      [1,2,3,4].map(l=>`<tr class="${o&&o.lv===l?'on':''}"><td>${LV[l]}</td><td>${RM(q.r[l])}</td></tr>`).join('')+
      `<tr class="sep"><td>Kos upgrade gear</td><td>${RM(GROUPS[q.g].hc)} / tahap</td></tr>`;

  }else{
    rows='<tr><td>Milik 1 utiliti</td><td>Dadu × 4</td></tr><tr><td>Milik 2 utiliti</td><td>Dadu × 10</td></tr>';
  }
  rows+=`<tr class="sep"><td>Nilai gadai</td><td>${RM(q.p/2)}</td></tr>`;
  const owner=o&&o.o!=null?`Pemilik: ${nm(o.o)}${o.m?' · digadai':''}${o.lv?' · '+LV[o.lv]:''}`:`Harga <b>${RM(q.p)}</b> · belum berpemilik`;
  return`<div class="deed" style="--band:${bandColor(i)}"><div class="deed-band"></div><p class="deed-own">${owner}</p><table class="deed-t"><tbody>${rows}</tbody></table><p class="tip"><span class="lbl">Tip lensa</span>${esc(q.tip)}</p></div>`;
}
const kindLabel=q=>q.k==='prop'?GROUPS[q.g].n:q.k==='plat'?'Platform':'Utiliti';
async function landBuyable(pi,i,roll){
  const q=SQ[i],o=S.own[i],p=P(pi);
  if(o.o==null){
    const v=await modal({toneColor:bandColor(i),kicker:`${kindLabel(q)} · belum berpemilik`,title:esc(q.n),body:deedHTML(i)+(p.cash<q.p?'<p class="err">Duit tak cukup untuk beli. Buka Bida Panas, mungkin dapat lebih murah!</p>':''),
      buttons:[{label:`Beli ${RM(q.p)}`,value:'buy',kind:'primary',disabled:p.cash<q.p},{label:'Bida Panas',value:'auc',kind:'hot'}]});
    if(v==='buy'){
      payBank(pi,q.p,false);o.o=pi;sfx.cash();log(`${nm(pi)} beli ${esc(q.n)} (${RM(q.p)}).`);
      if(q.k==='prop'&&hasSet(pi,q.g)){toast(`Set ${GROUPS[q.g].n} lengkap! Sewa ×2 dan boleh upgrade gear.`,'good');confetti()}
      render();
    }else await auction(i);
    return;
  }
  if(o.o===pi){toast('Lokasi sendiri. Selamat datang balik!');return}
  if(o.m){toast(`${esc(q.n)} sedang digadai. Tiada sewa.`);return}
  const owner=o.o,rent=rentOf(i,roll),canDuel=active().length>=3;
  const v=await modal({toneColor:P(owner).color,kicker:`Milik ${esc(P(owner).name)}`,title:esc(q.n),
    body:`<p class="big-num">${RM(rent)}</p><p>Sewa lokasi${S.golden?' (Golden Hour ×2)':''}${q.k==='util'?` · dadu ${roll} × ${countKind(owner,'util')===2?10:4}`:''}.</p><div class="duel-offer"><b>Atau cabar Duel Shutter.</b> 45 saat, tema sama, pemain lain jadi juri. Menang: sewa percuma + 500 followers. Kalah: bayar <b>${RM(rent*2)}</b>.</div>${canDuel?'':'<p class="hint">Duel perlukan sekurang-kurangnya 3 pemain aktif supaya ada juri.</p>'}`,
    buttons:[{label:`Bayar ${RM(rent)}`,value:'pay',kind:'primary'},{label:'Duel!',value:'duel',kind:'hot',disabled:!canDuel}]});
  if(v==='duel')return duel(pi,owner,rent);
  transfer(pi,owner,rent);sfx.cash();log(`${nm(pi)} bayar sewa ${RM(rent)} kepada ${nm(owner)} (${esc(q.s)}).`);render();
}

function auction(i){
  const q=SQ[i],api={},list=active();
  return modal({tone:'gold',kicker:'Bida Panas · semua pemain',title:esc(q.n),wide:true,
    body:`<div class="auc-top"><div><span class="lbl">Bida tertinggi</span><span class="big-num" id="aucBid">RM0</span><span class="muted" id="aucLead">Belum ada bida. Harga asal ${RM(q.p)}.</span></div><div class="auc-clock" id="aucClock"><b id="aucT">12</b><span class="lbl">saat</span></div></div><p class="auc-call" id="aucCall">Rebut peranti dan tekan untuk bida! Setiap bida tambah masa.</p><div class="auc-rows">${list.map(pi=>`<div class="auc-row" data-p="${pi}" style="--pc:${P(pi).color}"><span class="who"><span class="disc">${ini(P(pi))}</span>${esc(P(pi).name)} <span class="muted">${RM(Math.max(0,P(pi).cash))}</span></span><span class="auc-btns"><button type="button" class="btn sm" data-inc="10">+10</button><button type="button" class="btn sm" data-inc="50">+50</button><button type="button" class="btn sm" data-inc="100">+100</button></span></div>`).join('')}</div>`,
    buttons:[{label:'Tiada bida, tutup',kind:'primary',onClick:()=>api.end()}],
    onMount(el,close){
      let bid=0,lead=null,t=12,done=false;
      const upd=()=>{
        $('#aucBid',el).textContent=RM(bid);
        $('#aucLead',el).innerHTML=lead!=null?`oleh ${nm(lead)}`:`Belum ada bida. Harga asal ${RM(q.p)}.`;
        $('#aucT',el).textContent=t;
        $('#aucClock',el).classList.toggle('hurry',t<=3);
        if(lead!=null)$('#aucCall',el).textContent=t===3?'Sekali…':t===2?'Dua kali…':t===1?'Tiga kali…':'Ada lagi? Tekan untuk bida!';
        $$('.auc-row',el).forEach(r=>{const pi=+r.dataset.p;r.classList.toggle('lead',pi===lead);$$('[data-inc]',r).forEach(b=>b.disabled=bid+(+b.dataset.inc)>P(pi).cash)});
        $('.mbtns .btn',el).textContent=lead!=null?`Ketuk tukul: jual ${RM(bid)}!`:'Tiada bida, tutup';
      };
      const iv=setInterval(()=>{t--;if(t<=3&&t>0)sfx.tick();upd();if(t<=0)api.end()},1000);
      api.end=()=>{
        if(done)return;done=true;clearInterval(iv);
        if(lead!=null){payBank(lead,bid,false);S.own[i].o=lead;sfx.hammer();confetti();log(`${nm(lead)} menang Bida Panas ${esc(q.n)} dengan ${RM(bid)}!`);toast(`TERJUAL! ${esc(q.n)} kepada ${esc(P(lead).name)} (${RM(bid)})`,'gold')}
        else log(`Tiada bida untuk ${esc(q.n)}. Kekal milik bank.`);
        render();close(lead);
      };
      $$('[data-inc]',el).forEach(b=>b.onclick=()=>{
        const pi=+b.closest('.auc-row').dataset.p,nb=bid+(+b.dataset.inc);
        if(done||nb>P(pi).cash)return;
        bid=nb;lead=pi;if(t<6)t=6;sfx.tick();upd();
      });
      upd();
      return()=>clearInterval(iv);
    }});
}

async function drawCard(deck,pi,roll){
  const c=draw(deck),a=c.a,p=P(pi);
  sfx.card();log(`${nm(pi)} tarik Kad ${deck==='klien'?'Klien':'Viral'}: “${esc(c.h)}”`);
  const buttons=a.choice?a.choice.map((ch,k)=>({label:ch.label,value:k,kind:k?'ghost':'primary',disabled:!!ch.needFol&&p.fol<ch.needFol})):[{label:'Teruskan',value:-1,kind:'primary'}];
  const v=await modal({tone:deck,card:true,kicker:deck==='klien'?'Kad Klien':'Kad Viral',title:esc(c.h),body:`<div class="card-face">${esc(c.t)}</div>`,buttons});
  await applyCard(a.choice?a.choice[v]:a,pi,roll,c);
  render();
}
async function applyCard(a,pi,roll,c){
  const p=P(pi);
  if(a.cash>0){gain(pi,a.cash);sfx.cash()}
  if(a.cash<0){payBank(pi,-a.cash,true);sfx.lose()}
  if(a.fol)addFol(pi,a.fol);
  if(a.war){p.war++;toast('Kad Warranty disimpan.','good')}
  if(a.collectEach)active().filter(i=>i!==pi).forEach(i=>transfer(i,pi,a.collectEach));
  if(a.payEach)active().filter(i=>i!==pi).forEach(i=>transfer(pi,i,a.payEach));
  if(a.repairs){
    let n=0;S.own.forEach(o=>{if(o&&o.o===pi)n+=o.lv===4?a.repairs[1]:o.lv*a.repairs[0]});
    if(n){payBank(pi,n,true);sfx.lose()}
    toast(`Kos servis gear: ${RM(n)}`,n?'bad':'');
  }
  if(a.steal){
    const others=active().filter(i=>i!==pi).sort((x,y)=>P(y).cash-P(x).cash);
    if(others.length){const r=others[0],amt=Math.min(a.steal,Math.max(0,P(r).cash));transfer(r,pi,amt);log(`${nm(pi)} curi klien ${nm(r)}: ${RM(amt)}.`)}
  }
  if(a.golden){sfx.siren();startGolden()}
  if(a.collab){
    const w=await pickPlayer({tone:'viral',kicker:'Collab',title:'Pilih rakan collab',body:'<p>Kamu berdua dapat +500 followers.</p>',list:active().filter(i=>i!==pi)});
    addFol(pi,a.collab);addFol(w,a.collab);log(`${nm(pi)} collab dengan ${nm(w)}. +500 followers seorang.`);
  }
  if(a.dare){
    await timerModal({tone:'viral',kicker:'Cabaran berani',title:esc(c.h),seconds:a.dare.sec,note:esc(c.t)});
    const ok=await modal({tone:'viral',kicker:'Keputusan kumpulan',title:`${esc(p.name)} berjaya?`,body:'<p>Pemain lain undi dengan jujur.</p>',buttons:[{label:'Berjaya!',value:true,kind:'primary'},{label:'Gagal',value:false}]});
    const r=ok?a.dare.win:a.dare.lose;
    if(r.cash>0)gain(pi,r.cash);if(r.cash<0)payBank(pi,-r.cash,true);if(r.fol)addFol(pi,r.fol);
    if(ok){sfx.fanfare();confetti()}else sfx.lose();
    log(`${nm(pi)} ${ok?'berjaya':'gagal'} dalam cabaran berani.`);
  }
  if(a.solo){
    const st=await soloSnap(pi,30,'Job segera · snap solo');
    gain(pi,st*40);addFol(pi,st*100);sfx.cash();if(st>=4)confetti();
    log(`${nm(pi)} dapat ${st} bintang: +${RM(st*40)} dan +${NUM(st*100)} followers.`);
  }
  if(a.jail){sendToJail(pi);return}
  if(a.moveTo!=null){await moveTo(pi,a.moveTo);await land(pi,roll);return}
  if(a.back){await moveBy(pi,-a.back);await land(pi,roll);return}
  if(a.nearPlat){
    const t=[5,15,25,35].find(x=>x>p.pos)??5;
    await moveTo(pi,t);
    const o=S.own[t];
    if(o.o!=null&&o.o!==pi&&!o.m){
      const rent=rentOf(t)*2;
      await modal({toneColor:P(o.o).color,kicker:`Milik ${esc(P(o.o).name)}`,title:esc(SQ[t].n),body:`<p>Client VVIP: bayar 2× sewa.</p><p class="big-num">${RM(rent)}</p>`,buttons:[{label:`Bayar ${RM(rent)}`,value:true,kind:'primary'}]});
      transfer(pi,o.o,rent);sfx.cash();log(`${nm(pi)} bayar ${RM(rent)} kepada ${nm(o.o)} (Client VVIP).`);
    }else await land(pi,roll);
  }
}

    toast('Tak kembar. Kamera masih di bengkel.');return;

/* ---------- assets ---------- */
function groupHasLv(g){return SQ.some((x,j)=>x.k==='prop'&&x.g===g&&S.own[j].lv>0)}
function groupHasMort(g){return SQ.some((x,j)=>x.k==='prop'&&x.g===g&&S.own[j].m)}
function canUp(pi,i){const q=SQ[i],o=S.own[i];return q.k==='prop'&&o.o===pi&&!o.m&&o.lv<4&&hasSet(pi,q.g)&&!groupHasMort(q.g)&&P(pi).cash>=GROUPS[q.g].hc}
function canMort(pi,i){const q=SQ[i],o=S.own[i];return o.o===pi&&!o.m&&!(q.k==='prop'&&groupHasLv(q.g))}
function doAsset(pi,act,i){
  const p=P(pi),q=SQ[i],o=S.own[i];
  if(act==='mon'&&p.fol>=1000){p.fol-=1000;p.cash+=150;sfx.cash();log(`${nm(pi)} buat sponsored post: −1,000 followers, +RM150.`)}
  else if(act==='up'&&canUp(pi,i)){p.cash-=GROUPS[q.g].hc;o.lv++;addFol(pi,100);sfx.cash();log(`${nm(pi)} upgrade ${esc(q.n)} ke ${LV[o.lv]}.`);if(o.lv===4)confetti()}
  else if(act==='down'&&o.lv>0){o.lv--;p.cash+=GROUPS[q.g].hc/2;log(`${nm(pi)} jual gear di ${esc(q.n)} (+${RM(GROUPS[q.g].hc/2)}).`)}
  else if(act==='mort'&&canMort(pi,i)){o.m=true;p.cash+=q.p/2;log(`${nm(pi)} gadai ${esc(q.n)} (+${RM(q.p/2)}).`)}
  else if(act==='unm'&&o.m&&p.cash>=Math.ceil(q.p*.55)){p.cash-=Math.ceil(q.p*.55);o.m=false;log(`${nm(pi)} tebus ${esc(q.n)}.`)}
  if(S.phase==='debt'&&p.cash>=0){S.phase=S.afterDebt;toast('Hutang selesai!','good')}
  if(!checkWin())save();
}
function manageHTML(pi){

  if(!own.length)return head+'<p class="hint">Belum ada lokasi. Beli bila mendarat, atau menang Bida Panas.</p>';
  const rows=own.map(i=>{
    const q=SQ[i],o=S.own[i],isP=q.k==='prop',hc=isP?GROUPS[q.g].hc:0,set=isP&&hasSet(pi,q.g),unm=Math.ceil(q.p*.55);
    const status=o.m?'Digadai':isP?(o.lv?LV[o.lv]:set?'Set penuh':'Asas'):kindLabel(q);

async function trade(){
  if(!S||!['roll','end','debt'].includes(S.phase)||modalOpen())return;
  const a=S.turn,others=active().filter(i=>i!==a);
  if(!others.length)return;
  const b=others.length===1?others[0]:await pickPlayer({kicker:'Buat deal',title:'Berunding dengan siapa?',body:'<p>Tukar lokasi, duit atau followers. Rundingan bebas, tapi deal muktamad selepas salam.</p>',list:others,allowNone:true,noneLabel:'Batal'});

  const read=tag=>({props:$$(`.deal-col input[type="checkbox"][id^="dl${tag}"]:checked`).map(x=>+x.dataset.j),cash:Math.max(0,Math.floor(+$(`#dl${tag}cash`).value||0)),fol:Math.max(0,Math.floor(+$(`#dl${tag}fol`).value||0))});
  const offer=await modal({kicker:'Kontrak deal',title:`${esc(P(a).name)} ⇄ ${esc(P(b).name)}`,wide:true,body:`<div class="deal">${side(a,'A')}${side(b,'B')}</div><p class="err" id="dealErr" hidden></p>`,
    buttons:[{label:'Hantar tawaran',kind:'primary',onClick:close=>{
      const A=read('A'),B=read('B'),e=$('#dealErr');let msg='';
      if(!A.props.length&&!B.props.length&&!A.cash&&!B.cash&&!A.fol&&!B.fol)msg='Deal kosong. Pilih sekurang-kurangnya satu perkara.';
      else if(A.cash>Math.max(0,P(a).cash))msg=`${P(a).name} tak cukup duit.`;
      else if(B.cash>Math.max(0,P(b).cash))msg=`${P(b).name} tak cukup duit.`;
      else if(A.fol>P(a).fol)msg=`${P(a).name} tak cukup followers.`;
      else if(B.fol>P(b).fol)msg=`${P(b).name} tak cukup followers.`;
      if(msg){e.textContent=msg;e.hidden=false;return}
      close({A,B});
    }},{label:'Batal',value:null}]});
  if(!offer)return;
  const sum=x=>[...x.props.map(j=>esc(SQ[j].n)),x.cash?RM(x.cash):'',x.fol?NUM(x.fol)+' followers':''].filter(Boolean).join(', ')||'tiada apa-apa';
  const ok=await modal({kicker:`Serahkan peranti kepada ${esc(P(b).name)}`,title:'Setuju dengan deal?',body:`<div class="deal-sum"><p>${nm(a)} beri: ${sum(offer.A)}</p><p>${nm(b)} beri: ${sum(offer.B)}</p></div>`,buttons:[{label:'Setuju, salam!',value:true,kind:'primary'},{label:'Tolak',value:false}]});
  if(!ok){log(`${nm(b)} tolak deal daripada ${nm(a)}.`);save();render();return}
  offer.A.props.forEach(j=>S.own[j].o=b);offer.B.props.forEach(j=>S.own[j].o=a);
  P(a).cash+=offer.B.cash-offer.A.cash;P(b).cash+=offer.A.cash-offer.B.cash;
  P(a).fol+=offer.B.fol-offer.A.fol;P(b).fol+=offer.A.fol-offer.B.fol;

  if(S.phase==='debt'&&P(a).cash>=0){S.phase=S.afterDebt;toast('Hutang selesai!','good')}
  if(!checkWin()){save();render()}
}
async function declareBankrupt(){
  if(!S||S.phase!=='debt'||modalOpen())return;
  const pi=S.turn,p=cur(),to=p.debtTo>=0&&!P(p.debtTo).out?p.debtTo:-1;
  const ok=await modal({tone:'bad',kicker:'Isytihar muflis',title:`${esc(p.name)} tutup studio?`,body:`<p>Semua lokasi ${to>=0?`diserahkan kepada ${nm(to)}`:'kembali kepada bank'}. Anda keluar dari permainan, tapi masih boleh jadi juri!</p>`,buttons:[{label:'Ya, muflis',value:true,kind:'danger'},{label:'Batal',value:false}]});
  if(!ok)return;
  S.own.forEach(o=>{if(o&&o.o===pi){if(to>=0)o.o=to;else{o.o=null;o.lv=0;o.m=false}}});
  if(to>=0&&p.war)P(to).war+=p.war;
  p.out=true;p.cash=0;p.war=0;p.jail=false;S.outOrder.push(pi);
  sfx.lose();log(`${nm(pi)} MUFLIS! Studio ditutup.`);
  if(active().length<=1){endGame('last',active()[0]);return}
  nextTurn();
}

function newGame(names,mins,goal){
  S={v:1,
    players:names.map((n,i)=>({name:n,color:PCOL[i],cash:1500,fol:1000,pos:0,jail:false,jt:0,war:0,out:false,debtTo:-1})),
    own:SQ.map((q,i)=>BUY.has(q.k)?{o:null,lv:0,m:false}:null),
    turn:0,phase:'roll',afterDebt:'roll',dbl:0,pot:0,golden:0,dice:[5,3],
    decks:{klien:[],viral:[],snap:[],kilat:[]},kilatIn:rand(4,7),
    log:[],goal,msLeft:mins?mins*60000:null,finalCall:false,outOrder:[],overReason:null,winner:null};

function ranking(){
  let R=active().sort((x,y)=>worth(y).total-worth(x).total);
  if(S.winner!=null&&R.includes(S.winner))R=[S.winner,...R.filter(i=>i!==S.winner)];
  return[...R,...[...S.outOrder].reverse()];
}
function endGame(reason,w){
  S.phase='over';S.overReason=reason;
  S.winner=w!=null?w:active().sort((x,y)=>worth(y).total-worth(x).total)[0];
  log(`<b>Permainan tamat.</b> ${nm(S.winner)} menang!`);
  save();render();sfx.fanfare();confetti(true);
  showResults();
}

  const q=SQ[i];
  if(BUY.has(q.k))modal({toneColor:bandColor(i),kicker:`Petak ${i} · ${kindLabel(q)}`,title:esc(q.n),body:deedHTML(i),buttons:[{label:'Tutup',value:0,kind:'primary'}]});
  else modal({tone:q.k==='klien'?'klien':q.k==='viral'?'viral':q.k==='snap'?'snap':q.k==='golden'?'gold':q.k==='tax'||q.k==='gotojail'?'bad':'',kicker:`Petak ${i}`,title:esc(q.n),body:`<p>${esc(q.tip)}</p>${q.k==='golden'?`<p class="big-num">${RM(S?S.pot:0)}</p><p class="muted">Isi Tabung Golden Hour sekarang.</p>`:''}`,buttons:[{label:'Tutup',value:0,kind:'primary'}]});
}

/* ---------- boot ---------- */
setInterval(()=>{
  if(!S||S.msLeft==null||S.phase==='over'||document.hidden)return;
  S.msLeft=Math.max(0,S.msLeft-1000);
  if(S.msLeft<=0&&!S.finalCall){S.finalCall=true;sfx.siren();toast('Masa tamat! Giliran ini yang terakhir.','gold');log('<b>Masa tamat.</b> Permainan berakhir selepas giliran ini.');renderRail()}
  renderClock();
  if(S.phase!=='busy'&&S.msLeft%10000===0)save();
},1000);
buildBoard();render();
$('#mainBtn').addEventListener('click',onMain);
$('#btnRules').addEventListener('click',()=>{if(!modalOpen())modal({kicker:'Lensapoli',title:'Peraturan ringkas',wide:true,body:RULES,buttons:[{label:'Faham, jom main',value:0,kind:'primary'}]})});
const soundBtn=$('#btnSound');
const syncSound=()=>{soundBtn.textContent=sfx.on?'Bunyi: hidup':'Bunyi: senyap'};
syncSound();
soundBtn.addEventListener('click',()=>{sfx.toggle();syncSound();sfx.unlock();sfx.beep()});
$('#btnNew').addEventListener('click',async()=>{
  if(modalOpen())return;
  if(S&&S.phase!=='over'){const ok=await modal({tone:'bad',kicker:'Permainan baru',title:'Mula semula?',body:'<p>Permainan sekarang akan diganti bila anda mula permainan baru.</p>',buttons:[{label:'Ya, mula semula',value:true,kind:'danger'},{label:'Batal',value:false}]});if(!ok)return}
  setup();
});
const boot=data=>{
  if(data&&data.S){S=data.S;if(S.phase==='busy')S.phase=S.afterDebt||'end';save();render()}
  else setup();
};
try{window.claude?.hot?.snapshot?.(()=>({S:lastStable?JSON.parse(lastStable):null}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
</script>
</body>
</html>
